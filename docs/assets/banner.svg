<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="t d">
  <title id="t">HECE - Hypothesis &amp; Creativity Engine</title>
  <desc id="d">Banner with the HECE name and a graph of a goal connected to scored hypotheses.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b1d"/>
      <stop offset="0.55" stop-color="#16103d"/>
      <stop offset="1" stop-color="#0b2a4a"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="0.55" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f0abfc"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#67e8f9" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#67e8f9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <clipPath id="round"><rect width="1200" height="320" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <circle cx="930" cy="165" r="190" fill="url(#glow)" opacity="0.5"/>

    <!-- graph: goal -> hypotheses (edges) -->
    <g stroke="url(#edge)" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.85">
      <path d="M930 165 L1050 88" stroke-dasharray="6 7"><animate attributeName="stroke-dashoffset" from="26" to="0" dur="2.4s" repeatCount="indefinite"/></path>
      <path d="M930 165 L1085 178" stroke-dasharray="6 7"><animate attributeName="stroke-dashoffset" from="26" to="0" dur="2.1s" repeatCount="indefinite"/></path>
      <path d="M930 165 L1015 255" stroke-dasharray="6 7"><animate attributeName="stroke-dashoffset" from="26" to="0" dur="2.7s" repeatCount="indefinite"/></path>
      <path d="M930 165 L835 85" stroke-dasharray="3 6" opacity="0.6"/>
      <path d="M930 165 L815 232" stroke-dasharray="3 6" opacity="0.6"/>
      <path d="M835 85 L880 40" stroke-dasharray="3 6" opacity="0.4"/>
      <path d="M1050 88 L1130 52" stroke-dasharray="3 6" opacity="0.4"/>
      <path d="M1085 178 L1148 236" stroke-dasharray="3 6" opacity="0.4"/>
    </g>

    <!-- evidence nodes (arXiv) -->
    <g fill="#0b1229" stroke="#7dd3fc" stroke-width="1.6" opacity="0.9">
      <circle cx="835" cy="85" r="9"/>
      <circle cx="815" cy="232" r="9"/>
      <circle cx="880" cy="40" r="6"/>
      <circle cx="1130" cy="52" r="6"/>
      <circle cx="1148" cy="236" r="6"/>
    </g>

    <!-- goal node -->
    <circle cx="930" cy="165" r="38" fill="url(#glow)"/>
    <circle cx="930" cy="165" r="22" fill="#0b1229" stroke="url(#edge)" stroke-width="3"/>
    <circle cx="930" cy="165" r="8" fill="#67e8f9">
      <animate attributeName="r" values="7;10;7" dur="2.4s" repeatCount="indefinite"/>
    </circle>

    <!-- hypothesis nodes with deterministic scores -->
    <g font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="15" font-weight="700">
      <circle cx="1050" cy="88" r="25" fill="#0b1229" stroke="#4ade80" stroke-width="3"/>
      <text x="1050" y="93" text-anchor="middle" fill="#4ade80">0.90</text>

      <circle cx="1085" cy="178" r="25" fill="#0b1229" stroke="#4ade80" stroke-width="3"/>
      <text x="1085" y="183" text-anchor="middle" fill="#4ade80">0.75</text>

      <circle cx="1015" cy="255" r="25" fill="#0b1229" stroke="#f87171" stroke-width="3"/>
      <text x="1015" y="260" text-anchor="middle" fill="#f87171">0.35</text>
    </g>

    <!-- text -->
    <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
      <text x="70" y="88" font-size="14" font-weight="600" letter-spacing="4" fill="#7dd3fc"
            font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace">PYTHON  ·  OLLAMA  ·  ARXIV RAG</text>
      <text x="66" y="180" font-size="104" font-weight="800" letter-spacing="8" fill="url(#title)">HECE</text>
      <text x="70" y="226" font-size="27" font-weight="500" fill="#e2e8f0">Hypothesis &amp; Creativity Engine</text>
      <text x="70" y="264" font-size="18" font-style="italic" fill="#94a3b8">“Curiosity deserves methodology.”</text>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="19.5" fill="none" stroke="#ffffff" stroke-opacity="0.12"/>
</svg>
