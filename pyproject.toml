[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hece"
version = "1.0.0b2"
description = "Hypothesis & Creativity Engine: structured scientific investigation with local LLMs (Ollama), arXiv RAG and deterministic scoring."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Erick Cantagallo" }]
keywords = ["science", "hypothesis", "llm", "ollama", "rag", "arxiv", "multi-agent", "pydantic"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Flexible ranges for `pip install`. The exact versions tested by the author
# live in requirements.txt (reproducible environments).
dependencies = [
    "arxiv>=2.1,<5",
    "fpdf2>=2.8.1,<3",
    "ollama>=0.4,<1",
    "pydantic>=2.5,<3",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
hece = "hece.main:main"

[project.urls]
Homepage = "https://github.com/Erick-Cantagallo/HECE"
Issues = "https://github.com/Erick-Cantagallo/HECE/issues"
Changelog = "https://github.com/Erick-Cantagallo/HECE/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Lets `pytest` work on a fresh clone, without installing the package first.
pythonpath = ["src"]
testpaths = ["tests"]
